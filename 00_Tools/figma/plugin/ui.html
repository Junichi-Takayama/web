<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; margin: 12px; font-size: 12px; }
    .status { padding: 6px 10px; border-radius: 4px; font-weight: bold; margin-bottom: 10px; text-align: center; }
    .connected { background: #d4edda; color: #155724; }
    .disconnected { background: #f8d7da; color: #721c24; }
    #log { font-family: monospace; font-size: 10px; background: #eee; padding: 6px; height: 120px; overflow-y: auto; }
  </style>
</head>
<body>
  <div id="status" class="status disconnected">サーバー未接続 (http://localhost:3030)</div>
  <p>Cline からの自動描画命令を待機中...</p>
  <div id="log">ログ一覧:<br></div>

  <script>
    const SERVER_URL = 'http://localhost:3030';
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');

    function log(msg) {
      logEl.innerHTML += msg + '<br>';
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function pollCommands() {
      try {
        const res = await fetch(SERVER_URL + '/poll');
        if (res.ok) {
          statusEl.textContent = '接続中 (Cline Bridge Active)';
          statusEl.className = 'status connected';
          const data = await res.json();
          if (data && data.commands && data.commands.length > 0) {
            log(`命令受信: ${data.commands.length} 件`);
            parent.postMessage({ pluginMessage: { type: 'EXEC_COMMANDS', commands: data.commands } }, '*');
          }
        } else {
          statusEl.textContent = 'サーバーエラー';
          statusEl.className = 'status disconnected';
        }
      } catch (err) {
        statusEl.textContent = 'サーバー未接続 (http://localhost:3030)';
        statusEl.className = 'status disconnected';
      }
      setTimeout(pollCommands, 1000);
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (msg && msg.type === 'LOG') {
        log(msg.message);
      }
    };

    pollCommands();
  </script>
</body>
</html>
